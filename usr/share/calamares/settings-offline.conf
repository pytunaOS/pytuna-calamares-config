#
# Offline configuration file for Calamares
#

modules-search: [ local ]

instances:
  - id: install-kernel
    module: shellprocess
    config: shellprocess-install-kernel.conf

  - id: initialize-keyring
    module: shellprocess
    config: shellprocess-initialize-keyring.conf

  - id: cleanup-live-initcpio
    module: shellprocess
    config: shellprocess-cleanup-live-initcpio.conf

  - id: remove-live
    module: packages
    config: packages-remove-live.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
  
- exec:
  - partition
  - mount
  - unpackfs
  - shellprocess@install-kernel
  - shellprocess@cleanup-live-initcpio
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - shellprocess@initialize-keyring
  - initcpiocfg
  - initcpio
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - bootloader
  - packages@remove-live
  - umount
  
- show:
  - finished

branding: pytuna

prompt-install: false

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: false

quit-at-end: false
