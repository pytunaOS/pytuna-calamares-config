# Online configuration file for Calamares
# To be finished
modules-search: [ local ]

instances:
  - id: pacstrap
    module: shellprocess
    config: shellprocess-pacstrap.conf
    
  - id: restore-dns
    module: shellprocess
    config: shellprocess-restore-dns.conf

  - id: initialize-keyring
    module: shellprocess
    config: shellprocess-initialize-keyring.conf



sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
  
- exec:
  - partition
  - mount
  - shellprocess@pacstrap
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - shellprocess@initialize-keyring
  - shellprocess@restore-dns
  - initcpiocfg
  - initcpio
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - bootloader
  - umount
  
- show:
  - finished

branding: pytuna

prompt-install: false

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: false

quit-at-end: false
